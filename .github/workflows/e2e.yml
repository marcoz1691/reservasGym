name: E2E QA

# Regresión contra el ambiente QA real (zona-cero-qa.vercel.app), ver app/e2e/README.md.
# Corre después de cada merge a main (cuando Vercel ya desplegó QA) y a demanda.
# Requiere secrets del repo: SUPABASE_ACCESS_TOKEN (obligatorio) y E2E_SUPABASE_ANON_KEY (opcional).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright contra QA
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Correr suite E2E contra QA
        run: npm run test:e2e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      # Las trazas llevan tokens de sesión de las cuentas QA: se guardan pocos días.
      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/e2e/report
          retention-days: 3

      - name: Subir capturas/trazas de fallos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: app/e2e/results
          retention-days: 3

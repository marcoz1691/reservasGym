<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#FAFAF8; --line:#E7E4DF;
      --ink:#1C1917; --ink-2:#6B6560; --ink-3:#9C9690;
      --acc:#F26D17; --acc-contrast:#231F20; --acc-soft:rgba(242,109,23,.10);
      --ok-bg:#E8F6EE; --ok-tx:#1E8E5A; --wa-bg:#FDF2DC; --wa-tx:#B7791F; --da-bg:#FBEAEA; --da-tx:#D64545;
      --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 20px -8px rgba(15,23,42,.10);
      --font-sans:'IBM Plex Sans',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-sans); background:var(--bg); color:var(--ink); }
    .mono { font-family:var(--font-mono); }
    .card { border-radius:14px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .pill { border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; white-space:nowrap; }
    .chip { display:inline-flex; align-items:center; border-radius:999px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
    .chip.on { background:var(--acc); border-color:var(--acc); color:var(--acc-contrast); font-weight:700; }
    /* 48px de alto: por encima del minimo de 44px para tocar comodo */
    .btn { border-radius:12px; background:var(--acc); color:var(--acc-contrast); padding:14px 20px; font-size:15px; font-weight:700; text-align:center; display:block; }
    .btn-2 { border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:13px 18px; font-size:14px; font-weight:600; color:var(--ink-2); text-align:center; display:block; }
    .lbl { font-size:12.5px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:6px; }
    .inp { border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); padding:13px 14px; font-size:15px; color:var(--ink); }
    .eyebrow { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <header style="flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface);">
    <div style="display:flex; align-items:center; gap:8px;">
      <img src="mark-color.png" alt="Zona Cero" style="height:21px; width:auto; display:block;" />
      <span style="font-size:14px; font-weight:700; letter-spacing:-.01em;">Check-in</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="height:32px; width:32px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink-2);">AS</div>
    </div>
  </header>

  <main style="flex:1; min-height:0; overflow:hidden; padding:16px;">
    <div class="card" style="padding:20px; text-align:center;">
      <p class="mono" style="margin:0; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3);">CrossFit · Sesión de fuerza</p>
      <p style="margin:6px 0 0; font-size:16px; font-weight:700;">Hoy · 19:00</p>

      <div style="margin:18px auto 0; width:194px; height:194px; border-radius:12px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center;">
        <svg width="164" height="164" viewBox="0 0 29 29" shape-rendering="crispEdges">
          <rect width="29" height="29" fill="#fff"/>
          <g fill="#1C1917">
            <rect x="1" y="1" width="7" height="7"/><rect x="2" y="2" width="5" height="5" fill="#fff"/><rect x="3" y="3" width="3" height="3"/>
            <rect x="21" y="1" width="7" height="7"/><rect x="22" y="2" width="5" height="5" fill="#fff"/><rect x="23" y="3" width="3" height="3"/>
            <rect x="1" y="21" width="7" height="7"/><rect x="2" y="22" width="5" height="5" fill="#fff"/><rect x="3" y="23" width="3" height="3"/>
            <rect x="10" y="1" width="1" height="1"/><rect x="12" y="1" width="2" height="1"/><rect x="16" y="1" width="1" height="1"/>
            <rect x="11" y="3" width="1" height="2"/><rect x="14" y="2" width="1" height="3"/><rect x="17" y="3" width="2" height="1"/>
            <rect x="10" y="6" width="3" height="1"/><rect x="15" y="5" width="1" height="2"/><rect x="18" y="6" width="1" height="1"/>
            <rect x="1" y="10" width="1" height="1"/><rect x="3" y="10" width="2" height="1"/><rect x="6" y="10" width="1" height="2"/>
            <rect x="2" y="12" width="1" height="2"/><rect x="4" y="13" width="2" height="1"/><rect x="1" y="16" width="1" height="2"/>
            <rect x="5" y="16" width="2" height="1"/><rect x="3" y="18" width="1" height="1"/>
            <rect x="10" y="9" width="2" height="2"/><rect x="13" y="10" width="1" height="1"/><rect x="15" y="9" width="1" height="2"/>
            <rect x="17" y="10" width="2" height="1"/><rect x="11" y="12" width="1" height="2"/><rect x="14" y="13" width="2" height="1"/>
            <rect x="18" y="12" width="1" height="2"/><rect x="10" y="15" width="1" height="1"/><rect x="13" y="15" width="2" height="2"/>
            <rect x="17" y="16" width="1" height="1"/><rect x="11" y="18" width="2" height="1"/><rect x="16" y="18" width="2" height="1"/>
            <rect x="21" y="10" width="1" height="2"/><rect x="24" y="10" width="2" height="1"/><rect x="27" y="11" width="1" height="1"/>
            <rect x="22" y="13" width="2" height="1"/><rect x="26" y="13" width="1" height="2"/><rect x="21" y="16" width="1" height="1"/>
            <rect x="24" y="16" width="1" height="2"/><rect x="27" y="17" width="1" height="1"/>
            <rect x="10" y="21" width="1" height="2"/><rect x="13" y="21" width="2" height="1"/><rect x="17" y="21" width="1" height="1"/>
            <rect x="11" y="24" width="2" height="1"/><rect x="15" y="23" width="1" height="2"/><rect x="18" y="24" width="1" height="1"/>
            <rect x="10" y="26" width="2" height="1"/><rect x="14" y="26" width="1" height="1"/><rect x="17" y="26" width="2" height="1"/>
            <rect x="21" y="21" width="2" height="1"/><rect x="25" y="21" width="1" height="2"/><rect x="21" y="24" width="1" height="2"/>
            <rect x="24" y="24" width="2" height="1"/><rect x="27" y="25" width="1" height="1"/><rect x="23" y="27" width="2" height="1"/>
          </g>
        </svg>
      </div>

      <p class="mono" style="margin:14px 0 0; font-size:12px; letter-spacing:.14em; color:var(--ink-2);">ZC-0142-7391</p>
      <p style="margin:9px 0 0; font-size:12.5px; color:var(--ink-3); line-height:1.5;">
        Se activa <strong style="color:var(--ink-2);">20 min antes</strong> y expira al terminar la clase.
      </p>

      <div style="margin-top:14px; padding-top:13px; border-top:1px solid var(--line); display:flex; justify-content:center; gap:7px;">
        <span class="pill" style="background:var(--ok-bg); color:var(--ok-tx);">Membresía activa</span>
        <span class="pill" style="background:var(--surface-2); color:var(--ink-2);">Acceso permitido</span>
      </div>
    </div>

    <p style="margin:16px 0 0; text-align:center; font-size:12.5px; color:var(--ink-3);">
      Muestra este código en recepción
    </p>
  </main>

  <nav style="flex-shrink:0; border-top:1px solid var(--line); background:var(--surface); padding-bottom:8px;">
    <div style="display:flex; align-items:stretch;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 3px; color:var(--ink-3);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span style="font-size:10px; font-weight:500;">Inicio</span>
        <span style="height:3.5px;"></span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 3px; color:var(--ink-3);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        <span style="font-size:10px; font-weight:500;">Agenda</span>
        <span style="height:3.5px;"></span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 3px; color:var(--acc);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h11l4 4-4 4H4z"/></svg>
        <span style="font-size:10px; font-weight:700;">Reservas</span>
        <span style="width:18px; height:2.5px; border-radius:999px; background:var(--acc); margin-top:1px;"></span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 3px; color:var(--ink-3);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
        <span style="font-size:10px; font-weight:500;">Mi Plan</span>
        <span style="height:3.5px;"></span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 3px; color:var(--ink-3);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 7h5v5"/></svg>
        <span style="font-size:10px; font-weight:500;">Peso</span>
        <span style="height:3.5px;"></span>
      </div>
    </div>
  </nav>
</div>
</x-dc>
</body>
</html>

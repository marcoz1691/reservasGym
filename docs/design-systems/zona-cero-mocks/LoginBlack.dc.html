<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0A0A0B; --surface:#141415; --surface-2:#1B1B1D; --line:#27272A;
      --ink:#F4F4F3; --ink-2:#A19E9A; --ink-3:#6C6966;
      --acc:#FFFFFF; --acc-contrast:#0A0A0B; --acc-soft:rgba(255,255,255,.07);
      --ok-bg:rgba(126,169,139,.13); --ok-tx:#7EA98B; --wa-bg:rgba(196,163,90,.13); --wa-tx:#C4A35A; --da-bg:rgba(199,120,110,.13); --da-tx:#C7786E;
      --shadow:0 1px 2px rgba(0,0,0,.6), 0 8px 20px -8px rgba(0,0,0,.5);
      --font-sans:'IBM Plex Sans',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-sans); background:var(--bg); color:var(--ink); }
    .mono { font-family:var(--font-mono); }
    .card { border-radius:14px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
    .pill { border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; white-space:nowrap; }
    .chip { display:inline-flex; align-items:center; border-radius:999px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
    .chip.on { background:var(--acc); border-color:var(--acc); color:var(--acc-contrast); font-weight:700; }
    /* 48px de alto: por encima del minimo de 44px para tocar comodo */
    .btn { border-radius:12px; background:var(--acc); color:var(--acc-contrast); padding:14px 20px; font-size:15px; font-weight:700; text-align:center; display:block; }
    .btn-2 { border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:13px 18px; font-size:14px; font-weight:600; color:var(--ink-2); text-align:center; display:block; }
    .lbl { font-size:12.5px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:6px; }
    .inp { border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); padding:13px 14px; font-size:15px; color:var(--ink); }
    .eyebrow { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px; background:
    radial-gradient(circle, rgba(255,255,255,.055) 1px, transparent 1.6px) 0 0 / 22px 22px, var(--bg);">

    <div style="text-align:center; margin-bottom:28px;">
      <img src="logo-white.png" alt="Zona Cero" style="height:54px; width:auto; margin:0 auto 18px; display:block;" />
      <h1 style="margin:0; font-size:21px; font-weight:700;">Iniciar sesión</h1>
      <p style="margin:5px 0 0; font-size:13px; color:var(--ink-3);">Zona Cero Performance Center</p>
    </div>

    <div style="margin-bottom:16px;">
      <span class="lbl">Correo electrónico</span>
      <div class="inp">socio@gym.local</div>
    </div>

    <div style="margin-bottom:10px;">
      <span class="lbl">Contraseña</span>
      <div class="inp" style="letter-spacing:.2em;">••••••••</div>
    </div>

    <div style="text-align:right; margin-bottom:22px;">
      <span style="font-size:13px; font-weight:600; color:var(--acc);">¿Olvidaste tu contraseña?</span>
    </div>

    <div class="btn">Entrar</div>

    <div style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-3);">
      ¿No tienes cuenta? <span style="color:var(--acc); font-weight:600;">Crear cuenta</span>
    </div>

    <div style="margin-top:28px; padding-top:20px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:center; gap:9px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c0-2 1.5-3.5 3.5-3.5S19 9 19 11c0 4-2 7-3 8"/><path d="M5 11a7 7 0 0 1 12-5"/><path d="M8.5 11c0-2 1.5-3.5 3.5-3.5"/><path d="M12 11v3c0 2-.5 4-1.5 5.5"/><path d="M5 15c0 2 .5 3.5 1 4.5"/></svg>
      <span style="font-size:13px; font-weight:600; color:var(--ink-2);">Entrar con huella</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

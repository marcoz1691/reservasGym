<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2; --surface: #FFFFFF; --surface-2: #FAFAF8; --line: #E7E4DF;
      --ink: #1C1917; --ink-2: #6B6560; --ink-3: #9C9690;
      --acc: #F26D17; --acc-contrast: #231F20;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 16px 40px -12px rgba(15,23,42,.12);
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); color: var(--ink); }
    .mono { font-family: var(--font-mono); }

    .rise { opacity: 0; transform: translateY(10px); animation: rise .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .06s; } .d2 { animation-delay: .13s; } .d3 { animation-delay: .20s; }
    .d4 { animation-delay: .27s; } .d5 { animation-delay: .34s; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .card-in { opacity: 0; transform: translateY(14px) scale(.99); animation: cardIn .55s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes cardIn { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise, .card-in { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
</helmet>

<div style="width:1280px; height:820px; position:relative; overflow:hidden; background:
  radial-gradient(circle, rgba(28,25,23,.05) 1px, transparent 1.6px) 0 0 / 24px 24px,
  var(--bg);
  display:flex; align-items:center; justify-content:center;">

  <div class="card-in" style="position:relative; width:400px; border-radius:16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); padding:32px;">

    <div class="rise d1" style="text-align:center; margin-bottom:22px;">
      <img src="logo-color.png" alt="Zona Cero" style="height:52px; width:auto; margin:0 auto 14px; display:block;" />
      <h1 style="margin:0; font-size:19px; font-weight:700;">Iniciar sesión</h1>
      <p style="margin:4px 0 0; font-size:12.5px; color:var(--ink-3);">Zona Cero Performance Center</p>
    </div>

    <div class="rise d2" style="margin-bottom:14px;">
      <label style="display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px;">Correo electrónico</label>
      <div style="border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); padding:10px 12px; font-size:14px;">socio@gym.local</div>
    </div>

    <div class="rise d3" style="margin-bottom:8px;">
      <label style="display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px;">Contraseña</label>
      <div style="border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); padding:10px 12px; font-size:14px; letter-spacing:.2em;">••••••••</div>
    </div>

    <div class="rise d3" style="text-align:right; margin-bottom:16px;">
      <span style="font-size:12px; font-weight:600; color:var(--acc);">¿Olvidaste tu contraseña?</span>
    </div>

    <div class="rise d4" style="border-radius:10px; background:var(--acc); color:var(--acc-contrast); text-align:center; padding:11px 0; font-weight:700; font-size:14px;">Entrar</div>

    <div class="rise d5" style="text-align:center; margin-top:16px; font-size:12.5px; color:var(--ink-3);">
      ¿No tienes cuenta? <span style="color:var(--acc); font-weight:600;">Crear cuenta</span>
    </div>

    <div class="rise d5" style="margin-top:20px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); padding:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:11.5px; font-weight:600; color:var(--ink-2);">Acceso rápido demo:</span>
        <span class="mono" style="font-size:10px; color:var(--acc);">demo1234</span>
      </div>
      <div style="margin-top:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
        <div style="border-radius:8px; border:1px solid var(--line); background:var(--surface); text-align:center; padding:7px 0; font-size:11px; font-weight:600; color:var(--ink-2);">Socio</div>
        <div style="border-radius:8px; border:1px solid var(--line); background:var(--surface); text-align:center; padding:7px 0; font-size:11px; font-weight:600; color:var(--ink-2);">Staff</div>
        <div style="border-radius:8px; border:1px solid var(--line); background:var(--surface); text-align:center; padding:7px 0; font-size:11px; font-weight:600; color:var(--ink-2);">Admin</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

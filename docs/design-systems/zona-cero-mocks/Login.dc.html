<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E0B0A; --surface: #171310; --elevated: #231F20; --line: #3A322D;
      --ink: #FBF7F5; --ink-2: #B9ADA5; --ink-3: #8B7E76;
      --acc: #F26D17; --acc-hi: #FF8A3D; --acc-soft: rgba(242,109,23,.14); --acc-glow: rgba(242,109,23,.32); --acc-contrast: #231F20;
      --danger: #F43F5E;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-display: 'Barlow Semi Condensed', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); }
    .mono { font-family: var(--font-mono); }
    .disp { font-family: var(--font-display); }
  </style>
</helmet>

<div style="width:1280px; height:860px; background:var(--bg); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
  <div style="position:absolute; top:-140px; left:-120px; width:520px; height:520px; border-radius:999px; background:radial-gradient(circle, var(--acc-glow), transparent 70%); opacity:.4;"></div>
  <!-- Motivo de marca a gran escala: cuña + cinta diagonal, tomado de la papelería real (pág. 5 del imagotipo) -->
  <div style="position:absolute; left:0; bottom:0; width:560px; height:420px; overflow:hidden; pointer-events:none;">
    <div style="position:absolute; left:-60px; bottom:-80px; width:640px; height:520px; background:var(--elevated); clip-path: polygon(0% 100%, 0% 0%, 100% 100%);"></div>
    <div style="position:absolute; left:-60px; bottom:96px; width:660px; height:46px; background:var(--acc); clip-path: polygon(0 0, 100% 0, 84% 50%, 100% 100%, 0 100%);"></div>
  </div>

  <div style="position:relative; width:440px; border-radius:28px; border:1px solid var(--line); background:var(--surface); padding:32px; box-shadow: 0 24px 80px -20px rgba(0,0,0,.6);">

    <div style="display:flex; align-items:center; gap:12px;">
      <img src="logo-mark.png" alt="Zona Cero" style="height:42px; width:auto;" />
      <div>
        <p class="disp" style="margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em;">ZONA CERO</p>
        <p style="margin:2px 0 0; font-size:11px; color:var(--ink-3); line-height:1.4;">Centro de Rendimiento · Reservas &amp; Entrenamiento</p>
      </div>
    </div>

    <div style="margin-top:26px; display:flex; border-radius:16px; background:var(--elevated); border:1px solid var(--line); padding:4px;">
      <div style="flex:1; text-align:center; padding:9px 0; border-radius:12px; background:var(--acc); color:var(--acc-contrast); font-weight:700; font-size:13px;">Iniciar sesión</div>
      <div style="flex:1; text-align:center; padding:9px 0; font-weight:700; font-size:13px; color:var(--ink-2);">Crear cuenta</div>
    </div>

    <div style="margin-top:24px; display:flex; flex-direction:column; gap:6px;">
      <span class="mono" style="font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);">Correo electrónico</span>
      <div style="border-radius:16px; border:1px solid var(--line); background:var(--elevated); padding:12px 14px; font-size:14px; color:var(--ink);">socio@gym.local</div>
    </div>

    <div style="margin-top:16px; display:flex; flex-direction:column; gap:6px;">
      <span class="mono" style="font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);">Contraseña</span>
      <div style="border-radius:16px; border:1px solid var(--line); background:var(--elevated); padding:12px 14px; font-size:14px; letter-spacing:.2em; color:var(--ink);">••••••••</div>
    </div>

    <div style="margin-top:12px; text-align:right;">
      <span style="font-size:12px; font-weight:700; color:var(--acc);">¿Olvidaste tu contraseña?</span>
    </div>

    <div style="margin-top:18px; border-radius:16px; background:var(--acc); color:var(--acc-contrast); text-align:center; padding:13px 0; font-weight:800; font-size:14px;">Entrar</div>

    <div style="margin-top:24px; border-radius:16px; border:1px solid var(--line); background:var(--bg); padding:14px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:12px; font-weight:700; color:var(--ink-2);">Acceso rápido demo (desarrollo):</span>
        <span class="mono" style="font-size:10px; color:var(--acc);">demo1234</span>
      </div>
      <div style="margin-top:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
        <div style="border-radius:12px; border:1px solid var(--line); background:rgba(255,247,240,.03); text-align:center; padding:8px 0; font-size:11px; font-weight:700;">Socio</div>
        <div style="border-radius:12px; border:1px solid var(--line); background:rgba(255,247,240,.03); text-align:center; padding:8px 0; font-size:11px; font-weight:700;">Staff</div>
        <div style="border-radius:12px; border:1px solid var(--line); background:rgba(255,247,240,.03); text-align:center; padding:8px 0; font-size:11px; font-weight:700;">Admin</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
